<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webpage</title>
    <style>
        *{
            margin: 0;
        }
        h1 {text-align: center;
            font-size: 28px;
        }
        p {text-align: center;
            font-size: 14px;
        }
        h2 {
            text-align: center;
        }
        .header {
            padding: 20px;
            text-align: center;
            background: green;
            color: white;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }
        .section {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 15px;
            border: 1px solid #ddd;
            box-shadow: rgba(128, 128, 128, 0.4) 00px 0px 5px 5px;
        }
        .section img {
            border-radius: 8px;
            width: 250px;
            margin: 5px;
        }
        h3 {
            margin-left: 15px;
        }
        table {
            width: 100%;
            text-align: center;
        }
        th {
            border: 1px solid white;
            background-color: rgba(8, 191, 8, 0.529);
            color: white;
        }
        tr {
            border: 1px solid white;
        }
        .required:after {
            content: " *";
            color: red;
            width: 80%;
        }
        
        .buttons {
            margin-top: 15px;
        }

        button {
            padding: 6px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .submit-btn {
            background-color: hsl(212, 99%, 61%);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 10px;
        }

        .reset-btn {
            background-color: hsl(212, 99%, 61%);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 10px;
        }
        .section form {
            width: 400px;
            margin: 0 auto;
            text-align: center;
        }
        .section form input[type="text"],
        .section form input[type="email"],
        .section form input[type="password"],
        .section form textarea,
        .section form select {
            width: 100%;
            padding: 6px;
            margin-top: 5px;
            margin-bottom: 10px;
        }
        .section form div {
            text-align: left;
        }

        .inline-group {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }
        .file-box {
            border: 1px solid #ccc;
            padding: 8px;
            border-radius: 5px;
            width: 100%;
            background: #fff;
        }

    </style>
</head>
<body>
    <div class="header">
        <h1>Student Practice Webpage</h1>
        <p>HTML + CSS Practice(Forms + table advanced)</p>
    </div>
    <div class="section">
        <h3>Image section</h3>
        <img src="image/flower.jpg" >
    </div>
    <div class="section">
        <h3>Advanced table</h3>
        <table border="1" cellspacing="0" cellpading ="8">
            <tbody>
                <tr>
                    <th rowspan="2">Name</th>
                    <th colspan="2">Scores</th>
                    <th rowspan="2">Grade</th>
                </tr>
                <tr>
                    <th>Math</th>
                    <th>CS</th>
                </tr>
                <tr>
                    <td>Alice</td>
                    <td>90</td>
                    <td>95</td>
                    <td>A</td>
                </tr>
                <tr>
                    <td>Bob</td>
                    <td>80</td>
                    <td>85</td>
                    <td>B</td>
                </tr>
            </tbody>

        </table>
    </div>
    <div class="section">
        <h2>Form 1: Bassic Info</h2>
        <form action="/upload" method="post">
        <div>
            <label for="name" class="required">Name</label><br>
            <input type="text">
        </div>
        <div>
            <label for="email" class="required">Email</label><br>
            <input type="email">
        </div>
        <div>
            <label for="password" class="required">Password</label><br>
            <input type="password">
        </div>
        <div>
            <label for="uploadfile">Upload File</label>
            <div class="file-box">
                <input type="file">
            </div>
        </div>
        <br>
        <div>
        <input type="submit" value="Submit" class="submit-btn">
        <input type="reset" value="Reset" class="reset-btn">
        </div>
        </form>
    </div>
    <div class="section">
            <h2>Form 2: Survey Form</h2>
            <form action="/survey">
        <div>
            <label for="choosecourse" class="required">Choose Course</label><br>
            <select name="course" id="course"></select>          
        </div>
        <div>
            <label for="gender">Gender</label><br>
            <div class="inline-group">
                <input type="radio" id="male" name="gender">
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender">
                <label for="female">Female </label>
            </div>
        </div>
        <div>
            <label for="skill">Skills</label><br>
            <div class="inline-group">
                <input type="checkbox" id="html" name="skill">
                <label for="html">HTML</label><span></span>
                <input type="checkbox" id="css" name="skill"> 
                <label for="css">CSS</label><span></span>
                <input type="checkbox" id="js" name="skill">
                <label for="js">JS</label>
            </div>
        </div>
        <div>
            <label for="phone" class="required">Phone</label><br>
            <input type="text">
        </div>
        <div>
            <label for="message">Message</label><br>
            <textarea rows="4"></textarea>
        </div>
        <div>
            <button type="submit" class="submit-btn">Send</button>
        </div>
        </form>
    </div>
</body>
</html>
